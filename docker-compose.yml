services:
  web:
    build:
      context: .
      target: dev
    container_name: saien-front-dev
    command: sh -lc "rm -rf /app/.next/* && npm run dev"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      API_BASE_URL_INTERNAL: ${API_BASE_URL_INTERNAL:-http://host.docker.internal:8090}
      NEXT_PUBLIC_BACK_API_TARGET: ${NEXT_PUBLIC_BACK_API_TARGET:-auto}
      NEXT_PUBLIC_BACK_API_LOCAL_URL: ${NEXT_PUBLIC_BACK_API_LOCAL_URL:-http://localhost:8090}
      NEXT_PUBLIC_BACK_API_PROD_URL: ${NEXT_PUBLIC_BACK_API_PROD_URL:-https://api.saien.org}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.saien.org}
      NEXT_PUBLIC_MEMBER_STATUS_EXTENDED: ${NEXT_PUBLIC_MEMBER_STATUS_EXTENDED:-false}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - front_node_modules:/app/node_modules
      - front_next:/app/.next
    restart: unless-stopped

  web-prod:
    build:
      context: .
      target: runner
    container_name: saien-front-prod
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL_INTERNAL: ${API_BASE_URL_INTERNAL:-http://host.docker.internal:8090}
      NEXT_PUBLIC_BACK_API_TARGET: ${NEXT_PUBLIC_BACK_API_TARGET:-prod}
      NEXT_PUBLIC_BACK_API_LOCAL_URL: ${NEXT_PUBLIC_BACK_API_LOCAL_URL:-http://localhost:8090}
      NEXT_PUBLIC_BACK_API_PROD_URL: ${NEXT_PUBLIC_BACK_API_PROD_URL:-https://api.saien.org}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.saien.org}
      NEXT_PUBLIC_MEMBER_STATUS_EXTENDED: ${NEXT_PUBLIC_MEMBER_STATUS_EXTENDED:-false}
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: saien-front-nginx
    depends_on:
      - web
      - web-prod
    ports:
      - "8080:80"
      - "8081:81"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  front_node_modules:
  front_next:
